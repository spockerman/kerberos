# Ambiente local completo. Único pré-requisito: Docker.
#   docker compose up --build
# Keycloak: http://localhost:8080 (admin/admin) · Demo: http://localhost:3000 · Portal: http://localhost:3001 · E-mails: http://localhost:8025
# Inclui clientes simulados para testar a federação: IdP OIDC (realm initech-idp) e LDAP (ldap-umbrella).
name: kerberos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    image: kerberos/keycloak:local
    command: ["start", "--optimized"]
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      # URL pública: a mesma para o navegador e para o emissor (iss) dos tokens
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}
    ports:
      # Só em 127.0.0.1: não expõe o admin local na rede e, no Docker Desktop, evita que as conexões cheguem com
      # IP de origem público, o que faz o Keycloak exigir HTTPS ("HTTPS required").
      - "127.0.0.1:8080:8080"
      # portal-api compartilha a rede do Keycloak (ver serviço portal-api)
      - "127.0.0.1:8082:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A imagem do Keycloak não tem curl: consulta /health/ready pela porta de gestão (9000) via bash.
      # Pronto = HTTP 200 (enquanto inicializa, responde 503).
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Aplica o realm golden + ambiente local (infra/terraform/envs/local) e termina.
  terraform:
    image: hashicorp/terraform:1.17.2
    # Compartilha a rede do Keycloak: "localhost:8080" aqui dentro é o próprio Keycloak
    network_mode: "service:keycloak"
    working_dir: /workspace/envs/local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        terraform init -input=false -backend-config=path=/state/terraform.tfstate &&
        terraform apply -input=false -auto-approve
    environment:
      TF_IN_AUTOMATION: "1"
      TF_DATA_DIR: /state/.terraform
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_CLIENT_ID: admin-cli
      KEYCLOAK_USER: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/terraform:/workspace
      - terraform-state:/state
    depends_on:
      keycloak:
        condition: service_healthy
      ldap-umbrella:
        condition: service_started
    restart: "no"

  # LDAP SIMULADO de um cliente (tenant "umbrella"), para testar a federação LDAP localmente.
  ldap-umbrella:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: Umbrella
      LDAP_DOMAIN: umbrella.test
      LDAP_ADMIN_PASSWORD: admin-umbrella
    volumes:
      - ./infra/local/ldap/umbrella.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-umbrella.ldif:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  demo-api:
    build:
      context: apps/demo-api
    image: kerberos/demo-api:local
    environment:
      KEYCLOAK_ISSUER: http://localhost:8080/realms/demo
      # Chaves públicas buscadas pela rede interna do Docker
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/demo/protocol/openid-connect/certs
      API_AUDIENCE: demo-api
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8081:8080"
    depends_on:
      terraform:
        condition: service_completed_successfully

  demo-web:
    build:
      context: .
      dockerfile: apps/demo-web/Dockerfile
    image: kerberos/demo-web:local
    environment:
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: demo
      KEYCLOAK_CLIENT_ID: demo-web
      API_URL: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      demo-api:
        condition: service_started

  # ---------- Portal de provisionamento (Fase 3) ----------
  portal-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-portal}
    volumes:
      - portal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 20

  portal-api:
    build:
      context: portal/api
    image: kerberos/portal-api:local
    # A Admin API do Keycloak só aceita tokens emitidos pela URL pública (KC_HOSTNAME). Compartilhando a
    # rede do Keycloak, "localhost:8080" aqui dentro é o próprio Keycloak — como para o navegador.
    # A porta 8090 é publicada como 8082 no serviço keycloak. Em produção: KEYCLOAK_ADMIN_URL = URL pública.
    network_mode: "service:keycloak"
    environment:
      SERVER_PORT: "8090"
      PORTAL_DB_URL: jdbc:postgresql://portal-db:5432/portal
      PORTAL_DB_USER: portal
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:-portal}
      PORTAL_ISSUER: http://localhost:8080/realms/plataforma
      PORTAL_JWK_SET_URI: http://localhost:8080/realms/plataforma/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      KEYCLOAK_ADMIN_URL: http://localhost:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_CLIENT_ID: portal-provisioner
      KEYCLOAK_CLIENT_SECRET: ${PORTAL_PROVISIONER_SECRET:-segredo-local-portal}
      KEYCLOAK_SMTP_HOST: mailpit
      KEYCLOAK_SMTP_PORT: "1025"
    depends_on:
      portal-db:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully

  portal-web:
    build:
      context: .
      dockerfile: portal/web/Dockerfile
    image: kerberos/portal-web:local
    environment:
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: plataforma
      KEYCLOAK_CLIENT_ID: portal-web
      PORTAL_API_URL: http://localhost:8082
    ports:
      - "3001:3001"
    depends_on:
      portal-api:
        condition: service_started

volumes:
  postgres-data:
  terraform-state:
  portal-data:
