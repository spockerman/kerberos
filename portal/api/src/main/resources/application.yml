server:
  port: 8080

spring:
  datasource:
    url: ${PORTAL_DB_URL:jdbc:postgresql://localhost:5433/portal}
    username: ${PORTAL_DB_USER:portal}
    password: ${PORTAL_DB_PASSWORD:portal}

kerberos:
  # Quem pode usar o portal: tokens do realm da plataforma, emitidos para a portal-api
  security:
    issuer: ${PORTAL_ISSUER:http://localhost:8080/realms/plataforma}
    jwk-set-uri: ${PORTAL_JWK_SET_URI:http://localhost:8080/realms/plataforma/protocol/openid-connect/certs}
    audience: ${PORTAL_AUDIENCE:portal-api}
    required-role: ${PORTAL_REQUIRED_ROLE:provisionador}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}
  # Keycloak administrado pelo portal (conta de serviço portal-provisioner, realm master)
  keycloak:
    admin-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8080}
    public-url: ${KEYCLOAK_PUBLIC_URL:http://localhost:8080}
    client-id: ${KEYCLOAK_CLIENT_ID:portal-provisioner}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    login-theme: ${KEYCLOAK_LOGIN_THEME:kerberos}
    smtp-host: ${KEYCLOAK_SMTP_HOST:}
    smtp-port: ${KEYCLOAK_SMTP_PORT:1025}
    smtp-from: ${KEYCLOAK_SMTP_FROM:nao-responda@plataforma.local}

management:
  endpoints:
    web:
      exposure:
        include: health
